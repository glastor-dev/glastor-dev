name: Auto-Update README

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "README.generated.md"
  schedule:
    - cron: "0 3 * * 1" # Cada lunes a las 03:00 UTC
    - cron: "0 0 1 * *" # Primer día del mes a las 00:00 UTC (rotación de aperturas)
  workflow_dispatch:

concurrency:
  group: readme-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate README
        run: deno task readme:force

      - name: Create Pull Request with Co-Author
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs: auto-update README and metrics

            Co-authored-by: Andrés Cardoso <founder@glastor.es>
          committer: GitHub Action <action@github.com>
          author: Andrés Cardoso <founder@glastor.es>
          branch: automation/readme-update
          delete-branch: true
          title: "docs: automated README and ecosystem update"
          body: |
            ### 🤖 Automated Documentation Sync

            - Updated living profile metrics and AST generation.
            - Synchronized with `README.profile.md`.

            Co-authored-by: @glastor-dev <founder@glastor.es>
          labels: |
            documentation
            automated-pr

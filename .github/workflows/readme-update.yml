name: Auto-Update README

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "README.generated.md"
  schedule:
    - cron: "0 3 * * 1" # Cada lunes a las 03:00 UTC
    - cron: "0 0 1 * *" # Primer día del mes a las 00:00 UTC (rotación de aperturas)
  workflow_dispatch:

concurrency:
  group: readme-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate README
        run: deno task readme:force

      - name: Commit and Push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update README [skip ci]" && git pull --rebase origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }})
